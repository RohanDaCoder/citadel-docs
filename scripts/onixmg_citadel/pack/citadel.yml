# citadel.yml — Onix Minigames
# Ported from the live Paper server: server.properties, plugins/Skript and
# plugins/FastAsyncWorldEdit/schematics (downloaded 2026-10-30).
name: onixmg
entry: main.luau
motd: Onix Minigames
# The live spawn, exactly: Utils/1_Spawn.sk teleported to
# location(-46.5, -18.0, 38.5, world "world", -90, 0); lifted into
# Citadel's world with the same SHIFT as arena.luau (x +5, y +117, z -35).
# The point sits inside the lobby's invisible light pillar — a joiner
# drops the last two blocks to the floor, as on Paper.
spawn_point: [-41.5, 99.0, 3.5]
gamemode: 2
# This registry answers for every block the live 1.21 schematics use —
# pale oak, froglight, tuff bricks, the concrete floors, blue ice — so
# the arenas paste block for block (probe-verified 2026-10-30).
game: "1.12.2"
mode: lite
world: script
view_distance: 8
budget_ms: 4

permissions:
  default:
    nodes: [onix.play, onix.spawn]
  staff:
    inherits: [default]
    nodes:
      - onix.admin
      - onix.debug
      - "minecraft.command.gamemode"
      - "minecraft.command.tp"
      - citadel.build
